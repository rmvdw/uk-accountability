name: Data failure
description: A source fetch, parse or validation failed. Usually opened automatically.
labels: [data-failure]
body:
  - type: input
    id: indicator
    attributes:
      label: Indicator or source
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error and link to the failed run
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Investigation notes
