# TEMPORARY (Claude, #13), run 2: seed the draft GDP denominator with a live ONS fetch on a
# runner (this sandbox can't reach ONS), commit data/ back. Removed after use.
name: Seed GDP
on:
  push:
    branches: [immigration-restructure]
    paths: [.github/workflows/seed-gdp.yml]
permissions:
  contents: write
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run python -m ukdash refresh --indicator gdp_current_prices
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data && git commit -m "Seed GDP data (temporary workflow)" && git push
