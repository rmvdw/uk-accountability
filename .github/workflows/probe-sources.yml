# TEMPORARY (issue #13): runs only on this branch; removed before merge.
name: probe-sources
on:
  push:
    branches: [immigration-briefing]
    paths: [".github/probe/**", ".github/workflows/probe-sources.yml"]
permissions:
  contents: write
concurrency: probe-sources
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: pip install openpyxl==3.1.5
      - run: python .github/probe/probe_sources.py
      - name: Commit probe output to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-out
          git commit -m "Probe output (temporary)"
          git push
