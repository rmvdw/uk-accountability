# TEMPORARY (issue #3): runs only on this branch. Does a real `make refresh` for the draft
# indicator on a GitHub runner, because Claude's sandbox cannot reach OECD, and commits
# the promoted data back to the branch for review. Removed before the PR is merged;
# the permanent scheduled refresh is issue #4.
name: seed-oecd
on:
  push:
    branches: [oecd-unemployment]
    paths: [".github/workflows/seed-oecd.yml", "indicators/unemployment_rate.yml", "src/ukdash/sources/oecd.py"]
permissions:
  contents: write
concurrency: seed-oecd
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: make setup
      - run: make refresh ID=unemployment_rate
      - run: make check
      - name: Commit promoted data to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Seed unemployment_rate from live OECD fetch (runner ${{ github.run_id }})"
          git push
