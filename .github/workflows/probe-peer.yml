# TEMPORARY (Claude, #21/#22), run 2: find which peer migration sources are reachable and what
# they contain. Saves raw responses to probe/ and commits them back. Delete after use.
name: Probe peer migration sources
on:
  push:
    branches: [probe-peer-migration]
    paths: [.github/workflows/probe-peer.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          mkdir -p probe
          G7=GBR+USA+CAN+FRA+DEU+ITA+JPN
          get(){ echo "== $1"; curl -sS -m 120 -A "uk-accountability probe" -w "\nHTTP %{http_code}\n" -o "probe/$1" "$2" | tail -1 >> probe/status.txt; echo "$1 $(tail -c 300 probe/$1 | head -c 0)" ; sleep 8; }
          get unhcr_asylum_GFR.json "https://api.unhcr.org/population/v1/asylum-applications/?coa=GFR&yearFrom=2019&yearTo=2025&limit=1000"
          get unhcr_countries.json "https://api.unhcr.org/population/v1/countries/?limit=400"
          for f in probe/*; do echo "$f $(wc -c < $f) bytes"; done | tee -a probe/status.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "Probe results (temporary)" && git push
