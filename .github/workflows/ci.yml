name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - name: make setup
        run: make setup
      - name: make check
        run: make check
      - name: make build
        run: make build
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 14
