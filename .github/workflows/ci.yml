name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - name: make setup
        run: make setup
      - name: make check
        run: make check
      - name: make build
        run: make build
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 14
      - name: Build review preview (includes drafts)
        run: uv run python -m ukdash build --drafts --out site-preview
      - name: Upload review preview
        uses: actions/upload-artifact@v4
        with:
          name: site-preview-with-drafts
          path: site-preview/
          retention-days: 14

  # Agents and Ross may work on Windows, where there is no `make` by default.
  # Run the same steps directly, with Git's usual Windows line-ending conversion on.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run python -m ukdash check
      - run: uv run python -m ukdash build
