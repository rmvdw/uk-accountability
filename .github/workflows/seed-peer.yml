# TEMPORARY (Claude, #21/#22): seed the two draft peer indicators with a live fetch on a
# runner (this sandbox can't reach the sources), commit data/ back. Removed after use.
name: Seed peer indicators
on:
  push:
    branches: [peer-migration-indicators]
    paths: [.github/workflows/seed-peer.yml]
permissions:
  contents: write
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run python -m ukdash refresh --indicator permanent_immigration_per_1000 --indicator asylum_applications_per_1000
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data && git commit -m "Seed peer indicator data (temporary workflow)" && git push
