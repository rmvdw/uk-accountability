[project]
name = "ukdash"
version = "0.1.0"
description = "Free public dashboard comparing UK outcomes with peers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "markdown>=3.6",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
ukdash = "ukdash.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ukdash"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# With PYTHONWARNDEFAULTENCODING=1 (set by `make check`), text I/O that relies on the
# platform encoding fails on Linux too, not only on Windows (cp1252).
filterwarnings = [
    "error::EncodingWarning",
    "ignore::EncodingWarning:openpyxl",  # its xlsx writer, used only by tests
]
